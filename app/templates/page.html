{% extends "layout.html" %}

{% block content %}
<section class="content container">
  <article class="page-content">
    <p class="eyebrow">Kaya</p>
    <h1>{{ page.title }}</h1>
    <div class="markdown-body">{{ page_html | safe }}</div>
  </article>
</section>

<dialog class="image-lightbox" aria-label="Screenshot viewer">
  <button class="image-lightbox-close" type="button" aria-label="Close image viewer">&times;</button>
  <button class="image-lightbox-nav image-lightbox-previous" type="button" aria-label="Previous screenshot">&#8249;</button>
  <figure>
    <img src="" alt="" />
    <figcaption>
      <span class="image-lightbox-caption"></span>
      <span class="image-lightbox-count"></span>
    </figcaption>
  </figure>
  <button class="image-lightbox-nav image-lightbox-next" type="button" aria-label="Next screenshot">&#8250;</button>
</dialog>
{% endblock %}

{% block scripts %}
<script src="/static/page-gallery.js?v=20260709-3" defer></script>
{% endblock %}
