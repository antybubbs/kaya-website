{% extends "layout.html" %}

{% block content %}
<section class="content-section">
  <article class="page-content article-content glass-panel">
    {% set page_title = post.title %}
    {% set page_eyebrow = post.published_at.strftime('%d %b %Y') %}
    {% set page_lede = post.excerpt %}
    {% include "components/page_header.html" %}
    <div class="markdown-body">{{ post_html | safe }}</div>
  </article>
</section>
{% endblock %}
