services:
  website:
    build: .
    ports:
      - "8090:8090"
    environment:
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
    volumes:
      - kaya_website_data:/app/data
      - kaya_website_uploads:/app/uploads
    restart: unless-stopped

volumes:
  kaya_website_data:
  kaya_website_uploads:
